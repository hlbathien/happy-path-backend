name: Backend reproducibility
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install uv==0.12.21
      - run: make setup
      - run: uv lock --check
      - run: make test
      - run: make openapi && git diff --exit-code -- openapi.yaml
