[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "happy-path-backend"
version = "3.0.0"
description = "VMAP Happy Path Pareto-Optimal Road-Trip Itinerary Engine (Freeze-Spec v3.0)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.92.0",
    "uvicorn[standard]>=0.20.0",
    "pydantic>=1.10.0",
    "httpx>=0.23.0",
]

[tool.setuptools.packages.find]
where = ["src"]
