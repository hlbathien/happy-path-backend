[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "happy-path-backend"
version = "3.0.0"
description = "VMAP Happy Path Pareto-Optimal Road-Trip Itinerary Engine (Freeze-Spec v3.0)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.20.0",
    "pydantic>=2.0.0",
    "httpx>=0.23.0",
    "beautifulsoup4>=4.12.0",
]

[project.optional-dependencies]
scraping = ["crawl4ai>=0.9.5", "yt-dlp>=2026.8.19"]

[tool.setuptools.packages.find]
where = ["src"]
