openapi: 3.1.0
info:
  title: VMAP Happy Path Autopilot API (Freeze-Spec v3.0)
  description: Zero-cost Pareto-optimal road-trip synthesis backend for Vietnam (HCMC
    <-> Da Lat, Nha Trang, Vung Tau) with Physical Highway Interchanges, 48-Hour Schedule
    Validity, EV Fast-Charging, VETC Tolls & Transactional Session Mutations.
  version: 3.0.0
paths:
  /v1/itineraries/plan:
    post:
      tags:
      - Autopilot Planner
      summary: Plan Itineraries
      operationId: plan_itineraries_v1_itineraries_plan_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlanRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanResponse'
        '400':
          description: Invalid corridor or slice
        '409':
          description: No feasible route under constraints
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/itineraries/mutate:
    post:
      tags:
      - Autopilot Planner
      summary: Mutate Itinerary
      operationId: mutate_itinerary_v1_itineraries_mutate_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MutateRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MutateResponse'
        '404':
          description: Session not found
        '409':
          description: Infeasible mutation rolled back without modifying session
        '422':
          description: Invalid mutation action parameter
  /v1/corridors/health:
    get:
      tags:
      - System Health
      summary: Corridor Health
      operationId: corridor_health_v1_corridors_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CorridorHealthResponse'
components:
  schemas:
    CandidateArchetype:
      type: string
      enum:
      - P1_EXPRESS
      - P2_ICONIC
      - P3_SCENIC
      title: CandidateArchetype
    Coordinate:
      properties:
        lat:
          type: number
          maximum: 23.5
          minimum: 8.0
          title: Lat
          description: 'Latitude in decimal degrees (Vietnam bounds: 8.0 to 23.5)'
        lng:
          type: number
          maximum: 110.0
          minimum: 102.0
          title: Lng
          description: 'Longitude in decimal degrees (Vietnam bounds: 102.0 to 110.0)'
      type: object
      required:
      - lat
      - lng
      title: Coordinate
    CorridorHealthItem:
      properties:
        corridor_id:
          type: string
          title: Corridor Id
        name_vi:
          type: string
          title: Name Vi
        total_spine_km:
          type: number
          title: Total Spine Km
        verified_poi_count:
          type: integer
          title: Verified Poi Count
        branches:
          items:
            type: string
          type: array
          title: Branches
        bidirectional_ready:
          type: boolean
          title: Bidirectional Ready
      type: object
      required:
      - corridor_id
      - name_vi
      - total_spine_km
      - verified_poi_count
      - branches
      - bidirectional_ready
      title: CorridorHealthItem
    CorridorHealthResponse:
      properties:
        status:
          type: string
          title: Status
        engine:
          type: string
          title: Engine
        corridors:
          items:
            $ref: '#/components/schemas/CorridorHealthItem'
          type: array
          title: Corridors
      type: object
      required:
      - status
      - engine
      - corridors
      title: CorridorHealthResponse
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    MutateRequest:
      properties:
        session_id:
          type: string
          minLength: 4
          title: Session Id
          description: Stateful trip session ID returned by /plan
        corridor_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Corridor Id
        direction:
          anyOf:
          - type: string
          - type: 'null'
          title: Direction
        candidate_id:
          $ref: '#/components/schemas/CandidateArchetype'
          default: P2_ICONIC
        action:
          $ref: '#/components/schemas/MutationAction'
        target_poi_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Target Poi Id
        target_category:
          anyOf:
          - type: string
          - type: 'null'
          title: Target Category
        new_departure_iso:
          anyOf:
          - type: string
          - type: 'null'
          title: New Departure Iso
        locked_poi_ids:
          items:
            type: string
          type: array
          title: Locked Poi Ids
        rejected_poi_ids:
          items:
            type: string
          type: array
          title: Rejected Poi Ids
      type: object
      required:
      - session_id
      - action
      title: MutateRequest
    MutateResponse:
      properties:
        session_id:
          type: string
          title: Session Id
        mutated_candidate:
          $ref: '#/components/schemas/ParetoCandidate'
        duration_delta_minutes:
          type: integer
          title: Duration Delta Minutes
        cumulative_locked_poi_ids:
          items:
            type: string
          type: array
          title: Cumulative Locked Poi Ids
        cumulative_rejected_poi_ids:
          items:
            type: string
          type: array
          title: Cumulative Rejected Poi Ids
        delta_summary_vi:
          type: string
          title: Delta Summary Vi
      type: object
      required:
      - session_id
      - mutated_candidate
      - duration_delta_minutes
      - cumulative_locked_poi_ids
      - cumulative_rejected_poi_ids
      - delta_summary_vi
      title: MutateResponse
    MutationAction:
      type: string
      enum:
      - REMOVE_STOP
      - LOCK_STOP
      - SKIP_CATEGORY
      - SHIFT_DEPARTURE
      title: MutationAction
    ParetoCandidate:
      properties:
        candidate_id:
          $ref: '#/components/schemas/CandidateArchetype'
        label:
          type: string
          title: Label
        corridor_id:
          type: string
          title: Corridor Id
        active_branch_id:
          type: string
          title: Active Branch Id
        direction:
          type: string
          title: Direction
        powertrain:
          $ref: '#/components/schemas/PowertrainMode'
        total_drive_minutes:
          type: integer
          title: Total Drive Minutes
        total_dwell_minutes:
          type: integer
          title: Total Dwell Minutes
        total_wait_minutes:
          type: integer
          title: Total Wait Minutes
          default: 0
        total_duration_minutes:
          type: integer
          title: Total Duration Minutes
        total_detour_minutes:
          type: integer
          title: Total Detour Minutes
        estimated_vetc_toll_vnd:
          type: integer
          title: Estimated Vetc Toll Vnd
        ev_charging_satisfied:
          type: boolean
          title: Ev Charging Satisfied
        aggregate_utility_score:
          type: number
          title: Aggregate Utility Score
        aggregate_scenic_score:
          type: number
          title: Aggregate Scenic Score
        hazard_risk_score:
          type: number
          title: Hazard Risk Score
        tradeoff_summary_vi:
          type: string
          title: Tradeoff Summary Vi
        encoded_polyline:
          type: string
          title: Encoded Polyline
        stops:
          items:
            $ref: '#/components/schemas/PlannedStop'
          type: array
          title: Stops
        warnings:
          items:
            type: string
          type: array
          title: Warnings
      type: object
      required:
      - candidate_id
      - label
      - corridor_id
      - active_branch_id
      - direction
      - powertrain
      - total_drive_minutes
      - total_dwell_minutes
      - total_duration_minutes
      - total_detour_minutes
      - estimated_vetc_toll_vnd
      - ev_charging_satisfied
      - aggregate_utility_score
      - aggregate_scenic_score
      - hazard_risk_score
      - tradeoff_summary_vi
      - encoded_polyline
      - stops
      title: ParetoCandidate
    PlanRequest:
      properties:
        origin_query:
          type: string
          minLength: 2
          title: Origin Query
          example: Ho Chi Minh City
        destination_query:
          type: string
          minLength: 2
          title: Destination Query
          example: Da Lat
        origin_coords:
          anyOf:
          - $ref: '#/components/schemas/Coordinate'
          - type: 'null'
        destination_coords:
          anyOf:
          - $ref: '#/components/schemas/Coordinate'
          - type: 'null'
        departure_iso:
          type: string
          title: Departure Iso
          description: ISO-8601 departure timestamp or HH:MM (Vietnam UTC+7)
          default: '2026-10-16T06:00:00+07:00'
        vehicle_mode:
          $ref: '#/components/schemas/VehicleMode'
          default: car
        powertrain:
          $ref: '#/components/schemas/PowertrainMode'
          default: ice
        sedan_safe_only:
          type: boolean
          title: Sedan Safe Only
          default: true
      type: object
      required:
      - origin_query
      - destination_query
      title: PlanRequest
    PlanResponse:
      properties:
        session_id:
          type: string
          title: Session Id
        corridor_id:
          type: string
          title: Corridor Id
        corridor_name_vi:
          type: string
          title: Corridor Name Vi
        direction:
          type: string
          title: Direction
        active_start_km:
          type: number
          title: Active Start Km
        active_end_km:
          type: number
          title: Active End Km
        departure_clock:
          type: string
          title: Departure Clock
        time_bucket:
          type: string
          title: Time Bucket
        powertrain:
          $ref: '#/components/schemas/PowertrainMode'
        candidates:
          items:
            $ref: '#/components/schemas/ParetoCandidate'
          type: array
          title: Candidates
      type: object
      required:
      - session_id
      - corridor_id
      - corridor_name_vi
      - direction
      - active_start_km
      - active_end_km
      - departure_clock
      - time_bucket
      - powertrain
      - candidates
      title: PlanResponse
    PlannedStop:
      properties:
        stop_order:
          type: integer
          title: Stop Order
        poi_id:
          type: string
          title: Poi Id
        branch_id:
          type: string
          title: Branch Id
        goong_place_id:
          type: string
          title: Goong Place Id
        name_vi:
          type: string
          title: Name Vi
        commune_name:
          type: string
          title: Commune Name
        category:
          type: string
          title: Category
        exertion_level:
          type: string
          title: Exertion Level
        has_ev_charge:
          type: boolean
          title: Has Ev Charge
        is_arrival_anchor:
          type: boolean
          title: Is Arrival Anchor
        coordinates:
          $ref: '#/components/schemas/Coordinate'
        corridor_km_from_hcm:
          type: number
          title: Corridor Km From Hcm
        progress_km_from_origin:
          type: number
          title: Progress Km From Origin
        arrival_clock:
          type: string
          title: Arrival Clock
        service_start_clock:
          type: string
          title: Service Start Clock
        wait_minutes:
          type: integer
          title: Wait Minutes
          default: 0
        departure_clock:
          type: string
          title: Departure Clock
        dwell_minutes:
          type: integer
          title: Dwell Minutes
        detour_minutes:
          type: integer
          title: Detour Minutes
        utility_score:
          type: number
          title: Utility Score
        scenic_score:
          type: number
          title: Scenic Score
        tradeoff_note_vi:
          type: string
          title: Tradeoff Note Vi
        source_url:
          type: string
          title: Source Url
      type: object
      required:
      - stop_order
      - poi_id
      - branch_id
      - goong_place_id
      - name_vi
      - commune_name
      - category
      - exertion_level
      - has_ev_charge
      - is_arrival_anchor
      - coordinates
      - corridor_km_from_hcm
      - progress_km_from_origin
      - arrival_clock
      - service_start_clock
      - departure_clock
      - dwell_minutes
      - detour_minutes
      - utility_score
      - scenic_score
      - tradeoff_note_vi
      - source_url
      title: PlannedStop
    PowertrainMode:
      type: string
      enum:
      - ice
      - ev
      title: PowertrainMode
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    VehicleMode:
      type: string
      enum:
      - car
      - suv
      title: VehicleMode
